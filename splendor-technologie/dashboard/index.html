<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Splendor Technologie — Dashboard Prospects</title>
<style>
:root{--navy:#0b1f3a;--blue:#1677ff;--bg:#f4f7fb;--card:#fff;--text:#17283c;--muted:#64748b;--line:#dbe4ee}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.top{background:var(--navy);color:#fff;padding:16px 4%;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800}.wrap{max-width:1400px;margin:auto;padding:28px 4%}.auth,.panel,.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 22px rgba(15,35,60,.05)}.auth{max-width:430px;margin:60px auto;padding:28px}.auth h1{margin-top:0}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#eaf2ff;color:#135ab0}.danger{background:#ffecec;color:#a12626}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:22px}.stat{padding:17px}.stat b{display:block;font-size:1.7rem}.stat span{font-size:.85rem;color:var(--muted)}.panel{padding:18px;margin-bottom:20px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px}.filters input,.filters select{padding:11px;border:1px solid #cbd5e1;border-radius:9px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1050px}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:.9rem}.table th{background:#f8fafc;position:sticky;top:0}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf2f7;font-size:.78rem}.actions{display:flex;gap:6px;flex-wrap:wrap}.msg{padding:10px;margin:10px 0;border-radius:8px;background:#edf8f3;color:#12633d;display:none}.muted{color:var(--muted)}.detail{display:none;position:fixed;inset:0;background:rgba(5,18,35,.55);padding:5%;z-index:30}.modal{background:#fff;max-width:850px;max-height:90vh;overflow:auto;margin:auto;border-radius:16px;padding:25px}.modalgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal textarea{width:100%;min-height:110px}.modal input,.modal select,.modal textarea{padding:10px;border:1px solid #cbd5e1;border-radius:8px}.full{grid-column:1/-1}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr}.modalgrid{grid-template-columns:1fr}}
</style></head><body>
<header class="top"><div class="brand">SPLENDOR TECHNOLOGIE — DASHBOARD PROSPECTS</div><button id="logout" class="btn secondary hidden">Déconnexion</button></header>
<main class="wrap">
<section id="login" class="auth"><h1>Accès privé</h1><p class="muted">Connectez-vous pour gérer la base <b>ecole_web_prospects</b>.</p><div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="email"></div><div class="field"><label>Mot de passe</label><input id="loginPassword" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn primary">Se connecter</button><div id="loginMsg" class="msg"></div></section>
<section id="app" class="hidden">
<div class="stats">
<div class="stat"><b id="total">0</b><span>Total prospects</span></div><div class="stat"><b id="nosite">0</b><span>Sans site</span></div><div class="stat"><b id="emails">0</b><span>Emails</span></div><div class="stat"><b id="new">0</b><span>Nouveaux</span></div><div class="stat"><b id="contacted">0</b><span>Contactés</span></div><div class="stat"><b id="replied">0</b><span>Réponses</span></div>
</div>
<div class="panel"><div class="filters"><input id="q" placeholder="Rechercher établissement, commune, email…"><select id="status"><option value="">Tous les statuts</option><option>new</option><option>researched</option><option>contacted</option><option>replied</option><option>qualified</option><option>proposal</option><option>won</option><option>lost</option><option>do_not_contact</option></select><select id="site"><option value="">Tous les sites</option><option value="no_website">Sans site</option><option value="social_only">Réseaux sociaux seulement</option><option value="website_found">Site trouvé</option><option value="unknown">Inconnu</option></select><select id="commune"><option value="">Toutes les communes</option></select><button id="refresh" class="btn secondary">Actualiser</button></div><div id="appMsg" class="msg"></div></div>
<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2 style="margin:0">Prospects</h2><span class="muted" id="count"></span></div><div class="tablewrap"><table class="table"><thead><tr><th>Établissement</th><th>Zone</th><th>Contact</th><th>Web</th><th>Statut</th><th>Relance</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</section></main>
<div id="detail" class="detail"><div class="modal"><div style="display:flex;justify-content:space-between"><h2 id="modalTitle">Prospect</h2><button id="close" class="btn danger">Fermer</button></div><div class="modalgrid">
<div><label>Nom</label><input id="f_name"></div><div><label>Commune</label><input id="f_commune"></div><div><label>Email</label><input id="f_email"></div><div><label>Téléphone</label><input id="f_phone"></div><div><label>WhatsApp</label><input id="f_whatsapp"></div><div><label>Site web</label><input id="f_site"></div><div><label>Statut prospect</label><select id="f_status"><option>new</option><option>researched</option><option>contacted</option><option>replied</option><option>qualified</option><option>proposal</option><option>won</option><option>lost</option><option>do_not_contact</option></select></div><div><label>Statut site</label><select id="f_webstatus"><option>no_website</option><option>social_only</option><option>website_found</option><option>unknown</option><option>needs_verification</option></select></div><div><label>Prochaine relance</label><input id="f_follow" type="datetime-local"></div><div><label>Canal</label><input id="f_channel"></div><div class="full"><label>Notes</label><textarea id="f_notes"></textarea></div><div class="full"><label>Message FR</label><textarea id="f_msg"></textarea></div></div><button id="save" class="btn primary" style="margin-top:15px">Enregistrer</button><div id="saveMsg" class="msg"></div></div></div>
<script>
const URL='https://iponadqbqryxbhlgktak.supabase.co',KEY='sb_publishable_JHWb-gb6QcBYmPdXvZoBpA_aKPQa0au';
const H={'apikey':KEY,'Content-Type':'application/json'};
let token='',records=[],current=null;
async function api(path,opt={}){opt.headers={...(opt.headers||{}),...H,Authorization:'Bearer '+token};const r=await fetch(URL+path,opt);if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}
function show(id,on=true){document.getElementById(id).classList.toggle('hidden',!on)}
function msg(id,t){const e=document.getElementById(id);e.textContent=t;e.style.display='block'}
async function login(){try{const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:H,body:JSON.stringify({email:loginEmail.value,password:loginPassword.value})});if(!r.ok)throw new Error('Identifiants incorrects');const x=await r.json();token=x.access_token;show('login',false);show('app',true);show('logout',true);await load()}catch(e){msg('loginMsg',e.message)}}
async function load(){try{records=await api('/rest/v1/ecole_web_prospects?select=*&order=id.desc');buildStats();buildCommunes();render()}catch(e){msg('appMsg','Impossible de charger la base. Vérifiez les droits Supabase. '+e.message)}}
function buildStats(){const c=k=>records.filter(x=>x.prospect_status===k).length;total.textContent=records.length;nosite.textContent=records.filter(x=>x.website_status==='no_website').length;emails.textContent=records.filter(x=>x.email&&x.email.trim()).length;new.textContent=c('new');contacted.textContent=c('contacted');replied.textContent=c('replied')}
function buildCommunes(){const v=[...new Set(records.map(x=>x.commune).filter(Boolean))].sort();commune.innerHTML='<option value="">Toutes les communes</option>'+v.map(x=>'<option>'+esc(x)+'</option>').join('')}
function filtered(){const a=(q.value||'').toLowerCase(),s=status.value,w=site.value,c=commune.value;return records.filter(x=>(!a||[x.school_name,x.school_name_ar,x.commune,x.district,x.email,x.phone].some(v=>String(v||'').toLowerCase().includes(a)))&&(!s||x.prospect_status===s)&&(!w||x.website_status===w)&&(!c||x.commune===c))}
function render(){const list=filtered();count.textContent=list.length+' résultat(s)';rows.innerHTML=list.map(x=>'<tr><td><b>'+esc(x.school_name)+'</b><br><span class="muted">'+esc(x.school_name_ar||'')+'</span></td><td>'+esc(x.commune||'')+'<br>'+esc(x.district||'')+'</td><td>'+linkMail(x.email)+ '<br>'+esc(x.phone||'')+'</td><td>'+link(x.website_url,'Site')+' '+link(x.social_url,'Social')+'<br><span class="badge">'+esc(x.website_status)+'</span></td><td><span class="badge">'+esc(x.prospect_status)+'</span></td><td>'+formatDate(x.next_followup_at)+'</td><td><div class="actions"><button class="btn secondary" onclick="edit('+x.id+')">Modifier</button>'+((x.email&&x.prospect_status!=='do_not_contact')?'<a class="btn secondary" href="mailto:'+escAttr(x.email)+'?subject=Proposition%20Splendor%20Technologie">Email</a>':'')+'</div></td></tr>').join('')}
function link(u,t){return u?'<a href="'+escAttr(u)+'" target="_blank" rel="noopener">'+t+'</a>':''}function linkMail(e){return e?'<a href="mailto:'+escAttr(e)+'">'+esc(e)+'</a>':''}function formatDate(x){return x?new Date(x).toLocaleString('fr-FR'):'—'}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function escAttr(s){return esc(s)}
function edit(id){current=records.find(x=>x.id===id);if(!current)return;modalTitle.textContent=current.school_name;f_name.value=current.school_name||'';f_commune.value=current.commune||'';f_email.value=current.email||'';f_phone.value=current.phone||'';f_whatsapp.value=current.whatsapp||'';f_site.value=current.website_url||'';f_status.value=current.prospect_status;f_webstatus.value=current.website_status;f_follow.value=current.next_followup_at?new Date(current.next_followup_at).toISOString().slice(0,16):'';f_channel.value=current.contact_channel||'';f_notes.value=current.notes||'';f_msg.value=current.personalized_message_fr||'';detail.style.display='block'}
close.onclick=()=>detail.style.display='none';
async function save(){try{const patch={school_name:f_name.value.trim(),commune:f_commune.value.trim()||null,email:f_email.value.trim()||null,phone:f_phone.value.trim()||null,whatsapp:f_whatsapp.value.trim()||null,website_url:f_site.value.trim()||null,prospect_status:f_status.value,website_status:f_webstatus.value,next_followup_at:f_follow.value?new Date(f_follow.value).toISOString():null,contact_channel:f_channel.value.trim()||null,notes:f_notes.value.trim()||null,personalized_message_fr:f_msg.value.trim()||null,updated_at:new Date().toISOString()};await api('/rest/v1/ecole_web_prospects?id=eq.'+current.id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(patch)});msg('saveMsg','Prospect mis à jour.');await load()}catch(e){msg('saveMsg','Erreur : '+e.message)}}
loginBtn.onclick=login;save.onclick=save;refresh.onclick=load;q.oninput=render;status.onchange=render;site.onchange=render;commune.onchange=render;logout.onclick=()=>{token='';show('app',false);show('logout',false);show('login',true)};loginPassword.onkeydown=e=>{if(e.key==='Enter')login()};
</script></body></html>
